[package]
name = "douyin-danmaku"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.13.5", features = ["json", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
regex = "1.13.1"
rand = "0.10.3"
chrono = "0.4.45"
futures-util = "0.3.34"
flate2 = "1.1.11"
rquickjs = { version = "0.14.0", features = ["classes", "properties"] }
md-5 = "0.11.0"
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
